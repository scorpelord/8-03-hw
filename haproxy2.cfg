   global
     log /dev/log local0
     log /dev/log local1 notice
     chroot /var/lib/haproxy
     stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
     stats timeout 30s
     user haproxy
     group haproxy
     daemon

   defaults
     log global
     mode http
     option httplog
     timeout connect 5000ms
     timeout client 50000ms
     timeout server 50000ms

   frontend http_frontend
     bind :8888
     acl host_example_local hdr(host) -i example.local
     use_backend servers_backend if host_example_local

   backend servers_backend
     balance roundrobin
     server server1 127.0.0.1:8001 weight 2 check
     server server2 127.0.0.1:8002 weight 3 check
     server server3 127.0.0.1:8003 weight 4 check
   
