#cloud-config
packages:
  - apache2
  - mysql-server
  - php
  - libapache2-mod-php
  - php-mysql
  - curl

write_files:
  - path: /var/www/html/index.php
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <title>LAMP Instance</title>
          <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              .container { max-width: 800px; margin: 0 auto; text-align: center; }
              img { max-width: 100%; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
              .info { background: #f5f5f5; padding: 20px; border-radius: 10px; margin: 20px 0; }
          </style>
      </head>
      <body>
          <div class="container">
              <h1>Добро пожаловать на LAMP сервер!</h1>
              <div class="info">
                  <h2>Информация о сервере:</h2>
                  <p><strong>Hostname:</strong> <?php echo gethostname(); ?></p>
                  <p><strong>IP Address:</strong> <?php echo $_SERVER['SERVER_ADDR']; ?></p>
                  <p><strong>Date/Time:</strong> <?php echo date('Y-m-d H:i:s'); ?></p>
              </div>
              
              <h2>Картинка из Object Storage:</h2>
              <?php
              $image_url = "https://storage.yandexcloud.net/molostvov-student-01022026/picture.jpg";
              ?>
              <a href="<?php echo $image_url; ?>" target="_blank">
                  <img src="<?php echo $image_url; ?>" alt="Картинка из бакета" style="max-width: 600px;">
              </a>
              <p><a href="<?php echo $image_url; ?>" target="_blank">Открыть картинку в новой вкладке</a></p>
              
              <h2>Проверка PHP:</h2>
              <?php phpinfo(); ?>
          </div>
      </body>
      </html>
  - path: /tmp/setup_lamp.sh
    content: |
      #!/bin/bash
      # Настройка Apache
      systemctl enable apache2
      systemctl start apache2
      
      # Настройка MySQL
      systemctl enable mysql
      systemctl start mysql
      
      # Простая настройка безопасности MySQL (опционально)
      mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root_password';"
      mysql -e "FLUSH PRIVILEGES;"
      
      # Перезапуск Apache для применения изменений
      systemctl restart apache2
      
      # Логирование
      echo "LAMP установлен и настроен на $(date)" >> /var/log/lamp-setup.log

runcmd:
  - bash /tmp/setup_lamp.sh

users:
  - name: vm1
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh-authorized-keys:
      - ssh-rsa  root@vm1
