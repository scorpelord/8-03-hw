apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-init-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-init
  template:
    metadata:
      labels:
        app: nginx-init
    spec:
      initContainers:
      - name: check-service
        image: busybox:1.28
        command: ['sh', '-c', 'until nslookup nginx-service; do echo waiting for service; sleep 2; done']
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
